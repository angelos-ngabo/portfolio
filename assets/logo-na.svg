<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-label="NA">
  <defs>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700&amp;display=swap');
      .na {
        font-family: 'Poppins', system-ui, sans-serif;
        font-weight: 700;
        font-size: 24px;
        fill: #ffffff;
      }
    </style>
  </defs>

  <polygon
    points="40,4 72,22 72,58 40,76 8,58 8,22"
    fill="none"
    stroke="#ffffff"
    stroke-width="2"
    stroke-linejoin="round"
  />

  <g filter="url(#glow)" class="na">
    <text x="31" y="51" text-anchor="middle">N</text>
    <text x="49" y="51" text-anchor="middle">A</text>
  </g>
</svg>
